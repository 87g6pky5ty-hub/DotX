`,solution:`// The Dot Wildcard

// Replace (any character) + X with YY
[P:010] @SCREEN /.X/g -> YY
`},{title:"Character Classes",description:"Sometimes you don't want ANY character, but only specific ones. You can use brackets [] to give a list! [aeiou] finds any vowel. [0-9] finds any number.",task:"Write a rule that searches for [0-9] and replaces it with #.",code:`// Character Classes
@SCREEN -> .....1.......a.......5.......Z.......9......................................................................................................................................................................

// Replace any number [0-9] with #
// Add your rule here!
`,solution:`// Character Classes
@SCREEN -> .....1.......a.......5.......Z.......9......................................................................................................................................................................

// Replace any number [0-9] with #
[P:010] @SCREEN /[0-9]/g -> #
`},{title:"Capture Groups",description:'Parentheses () are used to "group" characters together so we can remember them. The first group is called $1, the second is $2. We can use these in our replacement to swap things around!',task:"Let's swap a letter and a number! Group a letter ([a-z]) and group a number ([0-9]). Then replace them with $2$1 to flip their order!",code:`// Capture Groups
@SCREEN -> .....a1.............b2.............c3.......................................................................................................................................................................

// Swap a letter and a number
// Use /([a-z])([0-9])/g -> $2$1
// Add your rule here!
`,solution:`// Capture Groups
@SCREEN -> .....a1.............b2.............c3.......................................................................................................................................................................

// Swap a letter and a number
[P:010] @SCREEN /([a-z])([0-9])/g -> $2$1
`},{title:"Quantifiers",description:'Curly braces {} let you say exactly how many characters you want. For example, .{19} means "exactly 19 of ANY character". Because our screen is exactly 20 characters wide, an item exactly 19 characters after another is directly below it!',task:`Let's swap "O" and "X", keeping the 19 characters between them intact. Use (O)(.{19})(X) and replace with $3$2$1!`,code:`// Quantifiers
// The X is exactly one row (19 characters) below the O.
@SCREEN -> ....................O...................X................................................................................................................................................................

// Swap O and X, keeping the 19 characters between them the same.
// Use /(O)(.{19})(X)/g -> $3$2$1
// Add your rule here!
`,solution:`// Quantifiers
// The X is exactly one row (19 characters) below the O.
@SCREEN -> ....................O...................X................................................................................................................................................................

// Swap O and X, keeping the 19 characters between them the same.
[P:010] @SCREEN /(O)(.{19})(X)/g -> $3$2$1
`}]},{id:"regexos_syntax",name:"1. Syntax: RegexOS Internals",description:"Learn the specific syntax of RegexOS: Buffers, Priorities, Conditions, and Colors.",steps:[{title:"The Buffers",description:"RegexOS works by manipulating text buffers. The main ones are @SCREEN (what you see), @INPUT (keys pressed), @DATA (for saving state), and @COLORS (for changing colors). You can also create your own custom buffers, like @MYBUFFER!",task:"Set up the @SCREEN to have a player 'O' and initialize a custom buffer @SCORE with '00'.",code:`// Initialize the Screen
@SCREEN -> ........................................................................O...........................................................................................................................

// Initialize the Score buffer (just create it and set its value!)
// Add your rule here!
`,solution:`// Initialize the Screen
@SCREEN -> ........................................................................O...........................................................................................................................

// Initialize the Score buffer (just create it and set its value!)
@SCORE -> 00
`},{title:"Priorities",description:"Rules run from lowest priority number to highest. [P:010] runs before [P:020]. If no priority is specified, it defaults to 100. Let's see why this matters!",task:"We have a rule that turns 'A' into 'B' and another that turns 'B' into 'C'. If 'A' becomes 'B' first, then 'B' becomes 'C', the 'A' will end up as 'C'! Change the priorities so 'B' turns to 'C' FIRST, then 'A' turns to 'B'.",code:`// Priorities
@SCREEN -> A.......B

// Make sure B becomes C, and A becomes B.
// If A becomes B first, it will then immediately become C in the next rule!

[P:020] @SCREEN /B/g -> C
`,solution:`// Priorities
@SCREEN -> A.......B

// Make sure B becomes C, and A becomes B.
// If A becomes B first, it will then immediately become C in the next rule!
[P:020] @SCREEN /A/g -> B
[P:010] @SCREEN /B/g -> C
`},{title:"Conditions",description:"You can make a rule run ONLY if a buffer exactly matches a specific string. We do this by prefixing the rule with ?@BUFFER=VALUE. For example, ?@INPUT=W.",task:"Write a rule that changes 'X' to 'Y' ONLY when the 'SPACE' key is pressed.",code:`// Conditions

// Change X to Y only when SPACE is pressed
?@INPUT=SPACE [P:010] @SCREEN /X/g -> Y

// Clean up input
[P:099] @INPUT /.*/g -> 
`},{title:"Changing Colors",description:"We added a new feature: @COLORS! You can define colors for characters by adding lines to the @COLORS buffer in the format 'CHAR: COLOR'.",task:"Set the color of 'X' to '#ff0000' (red) and 'O' to 'blue'. Note that the @COLORS buffer expects a multiline string where each line is a character and a color.",code:`// Colors
@SCREEN -> XXXX....OOOO

// Set the colors!

@COLORS -> 
`,solution:`// Colors
@SCREEN -> XXXX....OOOO

@COLORS -> X: #ff0000
O: blue
`}]},{id:"basics",name:"2. Basics: Drawing Your First World",description:"Let's get started! Learn how to set up the game screen and draw your very first character.",steps:[{title:"Welcome to REGEXOS! 👋",description:'Hi there! REGEXOS is a magical fantasy console where games are written using pattern matching (called Regular Expressions). To start, we need a blank canvas. We use the special "->" arrow to fill our screen with dots!',task:"Fill the @SCREEN with exactly 200 dots (.) by completing the rule below.",code:`// Welcome to REGEXOS! Let's make a screen!
