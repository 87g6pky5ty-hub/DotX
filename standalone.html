    <style>
      * {
        touch-action: manipulation;
      }
      body {
        background-color: #1a1a2e;
        margin: 0;
      }

      /* Mobile-first responsive editor improvements */
      :root {
        --vh: 1vh; /* updated by JS to account for mobile address bar */
        --toolbar-height: 48px;
        --touch-font-size: 16px; /* prevents iOS input zoom */
      }

      /* Ensure app fills available height reliably on mobile */
      html, body {
        height: 100%;
        -webkit-text-size-adjust: 100%; /* prevents font zoom */
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
        margin: 0;
        background: #1a1a2e;
        color: #e6eef8;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      }

      /* Main editor container, adapt class/ID to your app root (e.g., #app, .root) */
      #app, .app-root, .editor-root {
        height: calc(var(--vh, 1vh) * 100);
        display: flex;
        flex-direction: column;
      }

      /* Toolbar */
      .editor-toolbar {
        height: var(--toolbar-height);
        min-height: var(--toolbar-height);
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 8px;
        background: linear-gradient(180deg, rgba(26,26,46,0.9), rgba(26,26,46,0.8));
        z-index: 10;
      }

      /* Split panes: stacks on mobile, side-by-side on larger screens */
      .editor-split {
        display: flex;
        flex-direction: column;
        flex: 1 1 auto;
        min-height: 0; /* allow children to overflow correctly */
      }

      /* Each pane (editor / preview) */
      .editor-pane {
        box-sizing: border-box;
        overflow: auto;
        -webkit-overflow-scrolling: touch; /* momentum scroll */
        flex: 1 1 auto;
        padding: 12px;
      }

      /* On larger viewports use side-by-side layout */
      @media (min-width: 700px) {
        .editor-split { flex-direction: row; gap: 8px; }
        .editor-pane { padding: 16px; }
      }

      /* Make interactive elements large enough for touch */
      button, .btn, .toolbar-button {
        min-height: 40px;
        min-width: 40px;
        padding: 8px 10px;
        font-size: 14px;
        border-radius: 8px;
        touch-action: manipulation;
      }

      /* Editor content improvements (Monaco/CodeMirror common targets) */
      .monaco-editor, .monaco-editor .overflow-guard, .monaco-editor .view-lines {
        touch-action: pan-y;
        -webkit-user-select: text;
      }
      .CodeMirror, .cm-editor {
        touch-action: pan-y;
        -webkit-user-select: text;
      }

      /* Fullscreen editor mode */
      .editor-fullscreen {
        position: fixed !important;
        inset: 0;
        z-index: 99999;
        background: #0f1724;
        display: flex;
        flex-direction: column;
      }

      /* When keyboard is open, reduce visual shifts */
      .keyboard-open .editor-toolbar {
        /* keep toolbar visible and minimal */
        transform: translateY(0);
      }

      /* Hide sidebars on small screens by default (toggleable via JS) */
      .sidebar, .left-panel, .right-panel {
        transition: transform 180ms ease, opacity 120ms ease;
      }
      @media (max-width: 699px) {
        .sidebar, .left-panel, .right-panel { display: none !important; }
      }

      /* Inputs / textareas should be big enough */
      input[type="text"], textarea {
        font-size: var(--touch-font-size);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        caret-color: #90cdf4;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, "Courier New", monospace;
      }

      /* small helper for collapsed toggle */
      .mobile-toggle {
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }

      /* ensure code blocks / pre tags wrap on mobile */
      pre, code, .code-output {
        white-space: pre-wrap;
        word-break: break-word;
        font-size: 14px;
      }
    </style>

    <script>
    (function(){
      // Update --vh for mobile address bar / safe area handling
      function updateVh() {
        document.documentElement.style.setProperty('--vh', (window.innerHeight * 0.01) + 'px');
      }
      updateVh();
      window.addEventListener('resize', updateVh);
      window.addEventListener('orientationchange', function(){ setTimeout(updateVh, 300); });

      // Add class when an input/textarea/textarea-based editor is focused
      function onFocusIn(e) {
        var tg = e.target;
        if (!tg) return;
        try {
          if (tg.tagName === 'INPUT' || tg.tagName === 'TEXTAREA' || tg.isContentEditable || (tg.classList && tg.classList.contains('monaco-editor')) || (tg.closest && tg.closest('.monaco-editor'))) {
            document.documentElement.classList.add('keyboard-open');
            setTimeout(function(){ try{ tg.scrollIntoView({behavior:'smooth', block:'center', inline:'nearest'}); } catch(err){} }, 50);
          }
        } catch(err){}
      }
      function onFocusOut() { document.documentElement.classList.remove('keyboard-open'); }
      document.addEventListener('focusin', onFocusIn);
      document.addEventListener('focusout', onFocusOut);

      // Add full-screen toggle helper
      function toggleFullscreen(rootSelector) {
        var root = document.querySelector(rootSelector || '#app') || document.body;
        if (!root) return;
        root.classList.toggle('editor-fullscreen');
        updateVh();
      }
      window.toggleEditorFullscreen = toggleFullscreen;

      // Simple mobile sidebar toggle helper
      function toggleSidebar(selector) {
        var el = document.querySelector(selector);
        if (!el) return;
        var hidden = el.style.display === 'none' || window.getComputedStyle(el).display === 'none';
        el.style.display = hidden ? '' : 'none';
      }
      window.toggleSidebar = toggleSidebar;

      // Editor-specific mobile config (Monaco + CodeMirror)
      function tuneEditorsForMobile() {
        try {
          if (window.monaco && window.monaco.editor) {
            if (window.monacoEditors && Array.isArray(window.monacoEditors)) {
              window.monacoEditors.forEach(function(ed){
                try{
                  ed.updateOptions && ed.updateOptions({ fontSize: 16, lineNumbers: 'off', minimap: { enabled: false }, wordWrap: 'on', scrollBeyondLastLine: false, smoothScrolling: true, mouseWheelScrollSensitivity: 1, disableLayerHinting: true, scrollbar: { vertical: 'visible', horizontal: 'auto' } });
                  var wrapper = ed.getDomNode && ed.getDomNode(); if (wrapper) wrapper.style.touchAction = 'pan-y';
                }catch(e){}
              });
            } else {
              var nodes = document.querySelectorAll('.monaco-editor');
              nodes.forEach(function(node){ node.style.touchAction = 'pan-y'; });
            }
          }
        } catch(e){}

        try {
          if (window.CodeMirror) {
            if (window.codeMirrorInstances && Array.isArray(window.codeMirrorInstances)) {
              window.codeMirrorInstances.forEach(function(cm){
                try{ cm.setOption && cm.setOption('lineWrapping', true); cm.setOption && cm.setOption('viewportMargin', Infinity); cm.getWrapperElement && (cm.getWrapperElement().style.fontSize = '16px'); }catch(e){}
              });
            } else {
              var cmEls = document.querySelectorAll('.CodeMirror, .cm-editor');
              cmEls.forEach(function(el){ el.style.touchAction = 'pan-y'; el.style.fontSize = '16px'; });
            }
          }
        } catch(e){}
      }

      // Run after a short delay and on DOMContentLoaded
      setTimeout(tuneEditorsForMobile, 800);
      document.addEventListener('DOMContentLoaded', tuneEditorsForMobile);
    })();
    </script>
