<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>DOTX Mobile — Standalone</title>
    <meta name="theme-color" content="#1a1a2e" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="DOTX" />
    <!-- small SVG icon as data URI for apple touch -->
    <link
      rel="apple-touch-icon"
      href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='192' height='192'><rect width='100%' height='100%' fill='%236d4aff'/><text x='50%' y='55%' font-size='80' font-family='Arial' fill='white' text-anchor='middle' alignment-baseline='middle'>•</text></svg>"
    />

    <style>
      * { box-sizing: border-box; touch-action: manipulation; }
      :root { --vh: 1vh; --toolbar-height: 48px; --touch-font-size: 16px; }
      html,body{height:100%;margin:0;background:#1a1a2e;color:#e6eef8;font-family:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial; -webkit-text-size-adjust:100%;}
      #app{height:calc(var(--vh,1vh)*100);display:flex;flex-direction:column}
      .editor-toolbar{height:var(--toolbar-height);min-height:var(--toolbar-height);display:flex;align-items:center;gap:8px;padding:6px 8px;background:linear-gradient(180deg, rgba(26,26,46,0.95), rgba(26,26,46,0.88));z-index:10}
      .toolbar-button{background:transparent;border:1px solid rgba(255,255,255,0.06);color:inherit;padding:8px 10px;border-radius:8px;min-height:40px;min-width:40px}
      .editor-split{display:flex;flex-direction:column;flex:1 1 auto;min-height:0}
      .editor-pane{overflow:auto;flex:1 1 auto;padding:12px}
      .editor-pane textarea{width:100%;height:100%;min-height:220px;background:#0f1724;color:#e6eef8;border:1px solid rgba(255,255,255,0.04);padding:12px;border-radius:8px;font-size:var(--touch-font-size);font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,'Courier New',monospace;resize:none}
      .preview{background:#071026;border-radius:8px;padding:12px;color:#dbeafe;overflow:auto}
      pre,code{white-space:pre-wrap;word-break:break-word}
      .split-row{display:flex;gap:8px}
      @media (min-width:700px){ .editor-split{flex-direction:row} .editor-pane{padding:16px} .editor-pane{flex:1 1 50%} }
      .editor-fullscreen{position:fixed;inset:0;z-index:99999;background:#071026;display:flex;flex-direction:column}
      .hidden{display:none}
      .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    </style>
  </head>
  <body>
    <div id="app" class="app-root">
      <div class="editor-toolbar" role="toolbar" aria-label="Editor toolbar">
        <button class="toolbar-button" id="btn-full">Fullscreen</button>
        <button class="toolbar-button" id="btn-preview-toggle">Hide Preview</button>
        <div style="flex:1"></div>
        <button class="toolbar-button" id="btn-clear">Clear</button>
      </div>

      <div class="editor-split" id="editor-split">
        <div class="editor-pane" style="min-width:260px">
          <label for="editor-text" class="sr-only">Editor</label>
          <textarea id="editor-text" placeholder="Type Markdown or text here..."></textarea>
        </div>
        <div class="editor-pane" id="preview-pane">
          <div class="preview" id="preview">Preview will appear here</div>
        </div>
      </div>
    </div>

    <script>
      (function(){
        // Mobile safe-area height handling
        function updateVh(){ document.documentElement.style.setProperty('--vh', (window.innerHeight * 0.01) + 'px'); }
        updateVh(); window.addEventListener('resize', updateVh); window.addEventListener('orientationchange', function(){ setTimeout(updateVh,300); });

        // Keyboard open class
        function onFocusIn(e){ var tg = e.target; if(!tg) return; try{ if(tg.tagName==='INPUT' || tg.tagName==='TEXTAREA' || tg.isContentEditable){ document.documentElement.classList.add('keyboard-open'); setTimeout(function(){ try{ tg.scrollIntoView({behavior:'smooth', block:'center', inline:'nearest'}); }catch(err){} },50); } }catch(err){} }
        function onFocusOut(){ document.documentElement.classList.remove('keyboard-open'); }
        document.addEventListener('focusin', onFocusIn); document.addEventListener('focusout', onFocusOut);

        // Simple editor-preview bindings
        var textarea = document.getElementById('editor-text');
        var preview = document.getElementById('preview');
        var btnFull = document.getElementById('btn-full');
        var btnPreviewToggle = document.getElementById('btn-preview-toggle');
        var btnClear = document.getElementById('btn-clear');
        var previewPane = document.getElementById('preview-pane');
        var appRoot = document.getElementById('app');

        function escapeHtml(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
        function renderPreview(){ var v = textarea.value; if(!v) { preview.innerText = 'Preview will appear here'; return; }
          var out = escapeHtml(v)
            .replace(/^### (.*$)/gim,'<h3>$1</h3>')
            .replace(/^## (.*$)/gim,'<h2>$1</h2>')
            .replace(/^# (.*$)/gim,'<h1>$1</h1>')
            .replace(/\*\*(.*?)\*\*/gim,'<strong>$1</strong>')
            .replace(/\*(.*?)\*/gim,'<em>$1</em>')
            .replace(/`([^`]+)`/gim,'<code>$1</code>')
            .replace(/\n\n+/gim,'</p><p>')
            .replace(/\n/gim,'<br/>');
          // wrap paragraphs
          if(!out.startsWith('<p>') && out.indexOf('<h')!==0){ out = '<p>' + out + '</p>'; }
          preview.innerHTML = out;
        }

        textarea.addEventListener('input', renderPreview);
        textarea.addEventListener('change', renderPreview);
        renderPreview();

        btnFull.addEventListener('click', function(){ appRoot.classList.toggle('editor-fullscreen'); updateVh(); btnFull.innerText = appRoot.classList.contains('editor-fullscreen') ? 'Exit Fullscreen' : 'Fullscreen'; });
        btnPreviewToggle.addEventListener('click', function(){ previewPane.classList.toggle('hidden'); btnPreviewToggle.innerText = previewPane.classList.contains('hidden') ? 'Show Preview' : 'Hide Preview'; });
        btnClear.addEventListener('click', function(){ textarea.value=''; renderPreview(); textarea.focus(); });

        // Small accessibility helper: keyboard shortcuts
        document.addEventListener('keydown', function(e){ if((e.ctrlKey || e.metaKey) && e.key === 'b'){ e.preventDefault(); wrapSelection('**'); } if((e.ctrlKey || e.metaKey) && e.key === 'i'){ e.preventDefault(); wrapSelection('*'); } });
        function wrapSelection(wrapper){ var s = textarea.selectionStart, e = textarea.selectionEnd, val = textarea.value; var before = val.slice(0,s), mid = val.slice(s,e), after = val.slice(e); textarea.value = before + wrapper + mid + wrapper + after; textarea.selectionStart = s + wrapper.length; textarea.selectionEnd = e + wrapper.length; renderPreview(); textarea.focus(); }

        // tune fake "editor" for mobile (font-size to avoid zoom)
        textarea.style.fontSize = getComputedStyle(document.documentElement).getPropertyValue('--touch-font-size') || '16px';

        // run editor tuning after DOM ready
        setTimeout(function(){ textarea.scrollTop = 0; }, 300);

        // expose helpers for manual testing
        window.toggleEditorFullscreen = function(){ btnFull.click(); };
        window.toggleSidebar = function(sel){ var el = document.querySelector(sel); if(!el) return; var hidden = el.style.display === 'none' || window.getComputedStyle(el).display === 'none'; el.style.display = hidden ? '' : 'none'; };

      })();
    </script>
  </body>
</html>
